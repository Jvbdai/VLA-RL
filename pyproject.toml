[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-rl-study"
version = "0.1.0"
description = "Experiment scaffolding for residual VLA control under tracking faults"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
residual = ["stable-baselines3==2.7.0", "gymnasium>=1.1.1,<1.3"]

[tool.setuptools.packages.find]
where = ["src"]
